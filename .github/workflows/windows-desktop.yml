name: Windows desktop verification
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the shipped Windows runtime
        shell: pwsh
        run: Expand-Archive -LiteralPath downloads/FB-AutoPost-Windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/fb-desktop"
      - name: Verify native window and occupied-port recovery
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/fb-desktop/FB-AutoPost/runtime/python.exe" "$env:GITHUB_WORKSPACE/scripts/check_windows_desktop.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
